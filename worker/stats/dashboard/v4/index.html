<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>CS2 IP Changer · dados</title>
<link rel="icon" href="/d/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/d/style.css">
<link rel="stylesheet" href="/d/v4/v4.css">
<script src="/d/ui-map.js" defer></script>
<script src="/d/v4/real.js" defer></script>
<script src="/d/v4/funnel.js" defer></script>
<script src="/d/v4/app.js" defer></script>
</head>
<body data-page="brief">
<div class="topline"></div>
<header class="bar" id="hdr">
  <div class="bar-row">
    <a class="brand" href="/dashboard"><img class="mark" src="/d/logo.svg" alt="" width="22" height="22"><span>CS2 IP Changer</span></a>
    <nav class="tabs" aria-label="Páginas do painel"><a href="/dashboard">Resumo</a><a href="/data" aria-current="page">Dados</a></nav>
    <div class="crumb"><span id="crumbPage">Brief</span></div>
    <a class="health" id="health" href="#sistema" title="A saúde dos dados: abre Sistema e dados"><span class="hc">a ler os dados…</span></a>
    <div class="seg" id="period" role="group" aria-label="Período">
      <button data-p="1">Hoje</button><button data-p="7">7 dias</button><button data-p="30">30 dias</button><button data-p="90">90 dias</button>
    </div>
    <details class="flt" id="flt"><summary class="btn">Filtros<span class="flt-n" id="fltN"></span></summary><div class="flt-box" id="fltBox"></div></details>
    <button class="btn" id="csv" title="Exporta a tabela principal da página aberta">CSV</button>
    <label class="tgl" title="Só os teus PCs: builds de dev e os de EXCLUDE_IDS (?dev=1)"><input type="checkbox" id="mine"> Os meus PCs</label>
    <label class="tgl" title="De onde vem cada número"><input type="checkbox" id="srcs"> Fontes</label>
  </div>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Páginas"></nav>
  <main id="main"><p class="loading">A ler os dados…</p></main>
</div>
<div id="tip" role="tooltip"></div>
</body>
</html>
