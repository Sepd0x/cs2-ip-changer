<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>CS2 IP Changer · Resumo</title>
<link rel="icon" href="/d/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/d/v5/home.css">
<script type="module" src="/d/v5/home.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/dashboard"><img class="mark" src="/d/logo.svg" alt="" width="22" height="22"><span class="bn">CS2 IP Changer</span></a>
    <nav class="tabs" aria-label="Páginas"><a href="/dashboard" aria-current="page">Resumo</a><a href="/data" title="Todos os números, para quem faz a app">Dados</a></nav>
    <span class="pill" id="pill" aria-live="polite"></span>
  </div>
</header>
<main id="main">
  <section class="hero" id="hero"><div class="hl"><h1 class="sk sk-h1">&nbsp;</h1><p class="sk sk-p">&nbsp;</p></div></section>
  <section class="changes" id="changes" hidden></section>
  <section class="card welcome" id="welcome"></section>
  <section class="card board" id="board">
    <p class="b-cap">Últimos 7 dias, comparados com os 7 dias antes. Toca num número para o ver dia a dia.</p>
    <div class="tiles" id="tiles" role="tablist" aria-label="Números principais"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </section>
  <section class="card arrive" id="arrive"></section>
  <section class="card journey" id="journey"></section>
  <footer class="foot">Os números exatos, as regras e os erros estão em <a href="/data">Dados</a>.</footer>
</main>
<div id="tip" role="tooltip" hidden></div>
</body>
</html>
