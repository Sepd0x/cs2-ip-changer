<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 438" width="320" height="438" role="img" aria-label="Your PC sends CS2 and Steam over USB or the hotspot to the phone, which uses 4G or 5G to reach the CS2 server. The server sees the carrier's IP. Your home router still carries everything else, but it is blocked for CS2 and your servers.">
<style>
.bg{fill:#1D1D1D;stroke:#3A3A3A}
.node{fill:#242424;stroke:#3A3A3A;stroke-width:1}
.node.on{stroke:#5BA8F0;stroke-width:1.5}
.node.home{fill:#1D1D1D;stroke:#4A4A4A;stroke-dasharray:5 5}
.tx{fill:#E6E6E6}
.mu{fill:#9B9B9B}
.ac{fill:#5BA8F0}
.wire{stroke:#5BA8F0;stroke-width:2}
.pkt{fill:#5BA8F0}
.rule{stroke:#3A3A3A;stroke-dasharray:2 4}
.x circle{fill:#1D1D1D;stroke:#F05A4F}
.x path{stroke:#F05A4F}
@media (prefers-color-scheme: light){
.bg{fill:#F6F8FA;stroke:#D0D7DE}
.node{fill:#FFFFFF;stroke:#D0D7DE}
.node.on{stroke:#2B74C2}
.node.home{fill:#F6F8FA;stroke:#B6BEC6}
.tx{fill:#1F2328}
.mu{fill:#59636E}
.ac{fill:#2B74C2}
.wire{stroke:#2B74C2}
.pkt{fill:#2B74C2}
.rule{stroke:#D0D7DE}
.x circle{fill:#F6F8FA;stroke:#CF222E}
.x path{stroke:#CF222E}
}
@media (prefers-reduced-motion: reduce){.pkt{display:none}}
</style>
<rect class="bg" x=".5" y=".5" width="319" height="437" rx="12"/>
<path class="wire" d="M160 76 V132"/>
<path class="wire" d="M160 192 V248"/>
<text class="mu" x="174" y="109" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5">USB or hotspot</text>
<text class="mu" x="174" y="225" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5">4G / 5G</text>
<circle class="pkt" r="4"><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M160 76 V132"/></circle><circle class="pkt" r="4"><animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite" path="M160 76 V132"/></circle><circle class="pkt" r="4"><animateMotion dur="1.4s" begin="-0.35s" repeatCount="indefinite" path="M160 192 V248"/></circle><circle class="pkt" r="4"><animateMotion dur="1.4s" begin="-1.05s" repeatCount="indefinite" path="M160 192 V248"/></circle>
<g>
<rect class="node " x="16" y="16" width="288" height="60" rx="9"/>
<text class="tx" x="34" y="42" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">Your PC</text>
<text class="mu" x="34" y="62" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14">CS2 and Steam</text>
</g>
<g>
<rect class="node on" x="16" y="132" width="288" height="60" rx="9"/>
<text class="tx" x="34" y="158" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">Phone</text>
<text class="mu" x="34" y="178" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14">mobile data</text>
</g>
<g>
<rect class="node " x="16" y="248" width="288" height="60" rx="9"/>
<text class="tx" x="34" y="274" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">CS2 server</text>
<text class="ac" x="34" y="294" font-family="'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="14">sees 198.51.100.23</text>
</g>
<path class="rule" d="M16 326 H304"/>
<g>
<rect class="node home" x="16" y="344" width="288" height="78" rx="9"/>
<text class="tx" x="34" y="370" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">Home router</text>
<text class="mu" x="34" y="390" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14">everything else</text>
<g class="x" transform="translate(42 405)"><circle r="7.5" stroke-width="1.5"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke-width="1.8" stroke-linecap="round"/></g>
<text class="mu" x="56" y="410" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14">blocked for CS2 and your servers</text>
</g>
</svg>