<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Centered, so square crops (Reddit) and 1.91:1 crops (X) keep the title */
  html, body { background: #121212; }
  .frame { width: 1280px; height: 640px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .frame > img { width: 120px; height: 120px; }
  .title { font-size: 84px; line-height: 1; margin-top: 32px; }
  .tag { font-size: 34px; margin-top: 18px; }
  .route { margin-top: 44px; }
  .node { font-size: 24px; text-align: left; }
  .node small { font-size: 18px; }
  .arrow { width: 56px; }
</style>
<div class="frame topline">
  <img src="../logo.svg" alt="">
  <div class="title">CS2 IP Changer</div>
  <div class="tag muted">Route CS2 and Steam through your phone's mobile data.</div>
  <div class="route">
    <span class="node">Your PC</span><span class="arrow"></span>
    <span class="node phone">Phone<small>mobile data</small></span><span class="arrow"></span>
    <span class="node">Server sees<small class="ip mono">198.51.100.23</small></span>
  </div>
</div>
