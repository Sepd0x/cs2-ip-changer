# Builds the app and runs the tests on every push to main and on pull requests.
#
# The tests in tests/ are read-only: they don't touch routes, the firewall or Steam. Checks that need this PC
# (Steam installed, the phone, the home IP) print SALTO on the runner instead of failing. The admin tests
# (tests/AdminTests.cs) only run by hand.
#
# Third-party actions are pinned to a commit. The comment next to each one says which tag it is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build the app
        run: dotnet build src/ServerRouteTool.csproj -c Release

      - name: Run the tests
        run: dotnet run --project tests/Tests.csproj -c Debug
