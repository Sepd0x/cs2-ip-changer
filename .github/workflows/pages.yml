name: Pages

# The project site (site/ plus the screenshots and pictures from docs/) on https://sepd0x.github.io/cs2-ip-changer/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the site together
        run: |
          mkdir -p _site/img
          cp site/* _site/
          cp docs/screenshots/connection.png docs/screenshots/servers.png docs/screenshots/accounts.png _site/img/
          cp docs/assets/icon.png docs/assets/social-preview.png docs/assets/how-it-works-dark.svg _site/img/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
