name: Pages

# The project site (site/ plus the screenshots and pictures from docs/) on https://sepd0x.github.io/cs2-ip-changer/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends webp
      - name: Put the site together
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/img/
          cp docs/assets/icon.png docs/assets/social-preview.png docs/assets/how-it-works-dark.svg _site/img/
          cp docs/assets/favicon.svg docs/assets/favicon.ico docs/assets/apple-touch-icon.png _site/img/
          # Lossless WebP of each screenshot: same pixels, about a quarter of the size. The PNGs stay as the fallback.
          for f in _site/img/*.png; do
            case "$f" in */icon.png|*/social-preview.png|*/apple-touch-icon.png) continue ;; esac
            cwebp -quiet -lossless -z 9 "$f" -o "${f%.png}.webp"
          done
          test -f _site/img/connection.webp
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # IndexNow (Bing, Yandex, Seznam, Naver): tell them which pages to read again, from the sitemap that just went live.
      # The key is not a secret: it is the public file site/<key>.txt (and the same file at the root of sepd0x.github.io).
      # A failure here never fails the deploy.
      - name: Tell IndexNow about the pages
        continue-on-error: true
        run: |
          key=963725f7892f193e231f4827652ff39d
          urls=$(curl -fsS https://sepd0x.github.io/cs2-ip-changer/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' | grep -v '/img/' | sed 's/.*/"&"/' | paste -sd, -)
          test -n "$urls"
          curl -sS -o /dev/null -w 'IndexNow: %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"sepd0x.github.io\",\"key\":\"$key\",\"keyLocation\":\"https://sepd0x.github.io/$key.txt\",\"urlList\":[$urls]}"
