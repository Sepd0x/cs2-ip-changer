name: Feature request
description: Something the app should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you're in and what gets in the way. This matters more than the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working in the app.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version you use
      description: It's at the bottom left of the window.
      placeholder: v0.1.0 alpha.3
